[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawmemory-hermes"
version = "1.0.0"
description = "ClawMemory Memory Provider Plugin for Hermes Agent"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.entry-points."hermes.memory_provider"]
clawmemory = "clawmemory_hermes:ClawMemoryProvider"
